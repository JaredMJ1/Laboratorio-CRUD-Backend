<div class="login-container">
  <div class="login-card">

    <h1>CRUD System</h1>

    <p *ngIf="!modoRegistro">
      Inicia sesión para administrar tu inventario.
    </p>

    <p *ngIf="modoRegistro">
      Crea tu cuenta para acceder al sistema.
    </p>

    <form *ngIf="!modoRegistro" (ngSubmit)="iniciarSesion()">

      <label for="username">Usuario</label>
      <input
        id="username"
        type="text"
        name="username"
        [(ngModel)]="username"
        placeholder="Ingresa tu usuario"
        required
      />

      <label for="password">Contraseña</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        placeholder="Ingresa tu contraseña"
        required
      />

      <p class="error" *ngIf="error">{{ error }}</p>
      <p class="success" *ngIf="mensaje">{{ mensaje }}</p>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>

    <form *ngIf="modoRegistro" (ngSubmit)="registrar()">

      <label for="nuevoUsuario">Usuario</label>
      <input
        id="nuevoUsuario"
        type="text"
        name="nuevoUsuario"
        [(ngModel)]="username"
        placeholder="Crea un nombre de usuario"
        required
      />

      <label for="nuevaPassword">Contraseña</label>
      <input
        id="nuevaPassword"
        type="password"
        name="nuevaPassword"
        [(ngModel)]="password"
        placeholder="Crea una contraseña"
        required
      />

      <label for="confirmarPassword">Confirmar contraseña</label>
      <input
        id="confirmarPassword"
        type="password"
        name="confirmarPassword"
        [(ngModel)]="confirmarPassword"
        placeholder="Repite tu contraseña"
        required
      />

      <p class="error" *ngIf="error">{{ error }}</p>

      <button type="submit" [disabled]="cargando">
        {{ cargando ? 'Registrando...' : 'Crear cuenta' }}
      </button>

    </form>

    <p class="switch-mode">
      {{ modoRegistro ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?' }}

      <a href="#" (click)="$event.preventDefault(); cambiarModo()">
        {{ modoRegistro ? 'Inicia sesión' : 'Regístrate' }}
      </a>
    </p>

  </div>
</div>
